name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip and build
        run: |
          ZIP=$(ls flowbatch*.zip 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then ZIP=$(ls *.zip 2>/dev/null | head -n 1); fi
          if [ -z "$ZIP" ]; then echo "Repo me koi .zip file nahi mili."; exit 1; fi
          echo "Using zip: $ZIP"
          unzip -o "$ZIP" -d proj
          SETTINGS=$(find proj -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            INNER=$(find proj -name '*.zip' | head -n 1)
            if [ -n "$INNER" ]; then
              unzip -o "$INNER" -d proj/inner
              SETTINGS=$(find proj/inner -name settings.gradle | head -n 1)
            fi
          fi
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle nahi mili. Zip ke andar:"
            find proj | head -60
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FlowBatch-APK
          path: proj/**/app-debug.apk
